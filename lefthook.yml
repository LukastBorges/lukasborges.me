# Git hooks — installed automatically by lefthook's postinstall (skipped when CI=true).
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: '*.{js,ts,astro,json,jsonc,css,html}'
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
